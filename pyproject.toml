[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singular-agentic-os"
version = "3.32.0"
description = "SINGULAR: a governed personal agentic operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
runtime = ["openai-agents>=0.14.0"]
# `pytest-randomly` n'est pas un confort : le README affirme que la suite passe
# « in randomised order », et cette phrase a longtemps repose sur des graines que
# je passais a la main. Le CI ne l'installait pas, donc il ne l'exigeait jamais.
dev = ["pytest>=8.0", "pytest-randomly>=3.15", "ruff>=0.6", "mypy>=1.11", "anthropic>=1.0"]
# La faculte « Analyse » est la seule chose de ce depot qui consomme des jetons.
# Elle est optionnelle par construction : le journal, la chaine d'integrite, la
# Notice et la calibration tournent sans elle, et tests/test_sage_independence.py
# le verifie plutot que de le promettre. Ne pas l'installer coupe la faculte,
# rien d'autre.
analyse = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["singular*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `attic/` est une archive : son README dit qu'elle ne fait pas partie de
# SINGULAR, rien ne l'importe, et `packages.find` ne l'installe pas. La linter y
# comptait 56 constats que personne ne corrigera jamais -- c'est ce genre de
# bruit qui rend une etape decorative.
extend-exclude = ["attic"]

[tool.ruff.lint]
# Le jeu de regles est declare, pas herite. L'etape du CI bloque depuis
# aujourd'hui : si ruff elargissait ses defauts, le CI rougirait sans qu'une
# ligne du depot ait change, et la premiere reaction serait de le remettre en
# « informational ». C'etait justement l'etat d'avant -- rouge depuis toujours,
# 153 constats, donc incapable de signaler quoi que ce soit de nouveau.
select = ["E4", "E7", "E9", "F"]
# Un garde d'une ligne -- `if steps <= 0: return 0.0` -- est la forme assumee de
# ce depot, sur 25 sites. Une regle qu'on ne satisfera pas rend l'etape inutile ;
# on la retire explicitement plutot que de la laisser crier.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# Deux lambdas au code identique prouvent que la liaison d'une capability porte
# sur l'objet et non sur son code. Mesure : `artifact_fingerprint` inclut le
# `qualname`, donc deux `def` voisins ont deux empreintes differentes et le test
# ne prouverait plus rien. La raison longue est dans le fichier.
"tests/test_execution_capability.py" = ["E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
