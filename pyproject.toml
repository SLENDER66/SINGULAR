[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singular-agentic-os"
version = "3.30.0"
description = "SINGULAR: a governed personal agentic operating system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
runtime = ["openai-agents>=0.14.0"]
# `pytest-randomly` n'est pas un confort : le README affirme que la suite passe
# « in randomised order », et cette phrase a longtemps repose sur des graines que
# je passais a la main. Le CI ne l'installait pas, donc il ne l'exigeait jamais.
dev = ["pytest>=8.0", "pytest-randomly>=3.15", "ruff>=0.6", "mypy>=1.11", "anthropic>=1.0"]
# La faculte « Analyse » est la seule chose de ce depot qui consomme des jetons.
# Elle est optionnelle par construction : le journal, la chaine d'integrite, la
# Notice et la calibration tournent sans elle, et tests/test_sage_independence.py
# le verifie plutot que de le promettre. Ne pas l'installer coupe la faculte,
# rien d'autre.
analyse = ["anthropic>=1.0"]

[tool.setuptools.packages.find]
include = ["singular*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
