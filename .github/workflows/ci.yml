name: CI

on:
  # Lets a run be started by hand from the Actions tab, which matters when a
  # previous failure had nothing to do with the code.
  workflow_dispatch:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Do not spend runner time validating commits that have already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two versions, not three: the ends of the supported range. If 3.11 and
        # 3.13 both pass, 3.12 failing would be surprising, and every job costs
        # runner minutes that a private repository pays for.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Boundary audit
        run: python -c "from singular.execution_boundary_audit import ExecutionBoundaryAuditor; r=ExecutionBoundaryAuditor().audit(); print(f'checked_files={r.checked_files} clean={r.clean}'); print(*r.findings, sep='\\n'); raise SystemExit(0 if r.clean else 1)"
      # Cette etape etait « informational » et `continue-on-error` -- donc rouge
      # depuis toujours, 153 constats, incapable de signaler un defaut nouveau.
      # Elle bloque desormais, et `pyproject.toml` declare son jeu de regles au
      # lieu de l'heriter des defauts de ruff, pour qu'une mise a jour de l'outil
      # ne la fasse pas rougir sans qu'une ligne du depot ait change.
      - name: Lint
        run: ruff check .
      # Celle-la reste un rapport, et c'est mesure, pas paresseux : les 37
      # constats ont ete tries le 13 septembre 2026. Les deux plus gros amas --
      # 17 dans `validated_trajectory_decision.py`, 6 dans `outcome_ledger.py` --
      # sont le meme artefact : l'invariant est verifie a l'execution, dans un
      # `__post_init__` ou une boucle de refus, et mypy ne sait pas le suivre. Les
      # rendre verts demanderait 37 `assert` ecrits pour le verificateur et pour
      # personne d'autre. Le rapport reste lisible, il ne bloque pas.
      - name: Type check (rapport)
        continue-on-error: true
        run: mypy singular
      # Deux ordres, et les deux bloquent. L'ordre du disque est reproductible :
      # c'est celui qu'on relance pour comprendre un echec. L'ordre aleatoire
      # attrape ce que le premier ne peut pas voir -- un temoin partage entre
      # deux tests, defaut trouve a la main le 13 septembre 2026, et qu'aucune
      # etape du CI n'aurait vu. La graine est imprimee par pytest-randomly :
      # un echec ici se rejoue avec `pytest -p randomly --randomly-seed=<graine>`.
      - name: Tests (ordre du disque)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q -p no:randomly
      - name: Tests (ordre aleatoire)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q
