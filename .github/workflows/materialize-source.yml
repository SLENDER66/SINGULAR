name: Materialize SINGULAR source

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source tree
        run: |
          tar -xzf SINGULAR_GITHUB_FINAL.tar.gz -C .
          rm -f SINGULAR_GITHUB_FINAL.tar.gz

      - name: Commit source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "build: materialize complete SINGULAR source tree"
          git push
