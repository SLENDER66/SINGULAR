# La seule maison de la configuration pytest. `pyproject.toml` en portait une
# deuxieme, et pytest annonce a chaque demarrage qu'il l'ignore -- donc ce qui
# ressemblait le plus a la configuration canonique etait la copie morte.
# `pythonpath = .` est ce qui rend `from tools...` et `from tests...` importables.
[pytest]
pythonpath = .
testpaths = tests
